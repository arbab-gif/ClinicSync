<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic · ClinicSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="icon" href="../organizer/assets/logo-mark.png">
  <link rel="stylesheet" href="../organizer/css/organizer.css">
  <link rel="stylesheet" href="../organizer/css/pages/clinics.css">
  <link rel="stylesheet" href="../organizer/css/pages/clinic.css">
  <link rel="stylesheet" href="../organizer/css/pages/clinic-overview.css">
  <link rel="stylesheet" href="../organizer/css/pages/clinic-session-card.css">
  <link rel="stylesheet" href="../organizer/css/pages/clinic-sessions.css">
  <link rel="stylesheet" href="../organizer/css/pages/session-location.css">
  <link rel="stylesheet" href="../organizer/css/pages/direct-chat.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/pages/clinic.css">
</head>
<body>
  <!-- Player clinic: the organizer's clinic page (header, tabs, session cards, session modal) from the player's side -->
  <header data-player-header data-active="Clinics"></header>

  <main class="page">
    <div class="c-topbar"><a class="back" href="clinics.html"><img class="icon" src="../organizer/assets/icons/arrow-left.svg" alt="">My clinics</a><span class="badge" id="c-status"></span></div>
    <div class="clinic-head">
      <div>
        <div class="clinic-title"><span class="title-wrap"><h1 id="c-name"></h1></span><span class="chip" id="c-role"></span><span class="chip" id="c-sport"></span></div>
        <div class="clinic-meta">
          <span><img class="icon-20" src="../organizer/assets/icons/calendar-blank.svg" alt=""><span id="c-schedule"></span></span>
          <span><img class="icon-20" src="../organizer/assets/icons/map-pin.svg" alt=""><span id="c-location"></span></span>
        </div>
        <p class="clinic-desc" id="c-desc" hidden></p>
      </div>
      <div class="clinic-actions">
        <a class="btn btn-messages" href="messages.html"><img class="icon-20" src="../organizer/assets/icons/chat-circle.svg" alt="">Messages <span class="msg-count" id="c-msgs">2</span></a>
      </div>
    </div>
    <nav class="tabs" aria-label="Clinic" id="c-tabs">
      <button type="button" data-tab="overview">Overview</button>
      <button type="button" data-tab="sessions">Sessions</button>
      <button type="button" data-tab="players">Players</button>
      <button type="button" data-tab="payments">Payments</button>
    </nav>

    <div id="c-banner"></div>
    <div id="c-body"></div>
  </main>

  <!-- Session details (filled per session) -->
  <div class="overlay" id="session" hidden role="dialog" aria-modal="true" aria-labelledby="sm-title">
    <div class="modal modal-lg session-modal" id="sm"></div>
  </div>

  <!-- Can't make it → replacement request -->
  <div class="overlay" id="replace" hidden role="dialog" aria-modal="true" aria-labelledby="rp-title">
    <div class="modal p-modal">
      <button class="x-btn" type="button" data-close aria-label="Close">✕</button>
      <h2 id="rp-title">Can’t make it?</h2>
      <p class="lead">Your spot goes to other players first, then substitutes.</p>
      <p class="cm-session"><img src="../organizer/assets/icons/calendar-blank-16.svg" alt=""><span id="rp-lead"></span></p>
      <div class="field"><label for="rp-why">Reason <span class="req">*</span></label><select class="select" id="rp-why" required><option value="">Choose a reason</option><option>Illness</option><option>Work</option><option>Travel</option><option>Family</option><option>Other</option></select></div>
      <div class="field"><textarea class="textarea cm-note" id="rp-reason" rows="1" aria-label="Add a note" placeholder="Add a note for Jenny and the group"></textarea></div>
      <div class="p-acts"><button class="btn btn-lg btn-soft" type="button" data-close>Keep my spot</button><button class="btn btn-lg btn-primary" type="button" id="rp-go" disabled>Request a replacement</button></div>
    </div>
  </div>

  <!-- Join an open spot -->
  <div class="overlay" id="join" hidden role="dialog" aria-modal="true" aria-labelledby="jn-title">
    <div class="modal p-modal">
      <button class="x-btn" type="button" data-close aria-label="Close">✕</button>
      <h2 id="jn-title">Confirm your spot</h2>
      <p class="lead">Review the session details before confirming your spot.</p>
      <div class="jn-when">
        <b id="jn-date"></b>
        <span><img src="../organizer/assets/icons/clock-16.svg" alt=""><span id="jn-time"></span></span>
        <span><img src="../organizer/assets/icons/map-pin-16.svg" alt=""><span id="jn-loc"></span></span>
      </div>
      <dl class="jn-rows">
        <div><dt>Joining as</dt><dd id="jn-role"></dd></div>
        <div><dt>Coach fee</dt><dd id="jn-fee"></dd></div>
      </dl>
      <div class="p-acts"><button class="btn btn-lg btn-soft" type="button" data-close>Cancel</button><button class="btn btn-lg btn-primary" type="button" id="jn-go">Confirm spot</button></div>
    </div>
  </div>

  <!-- Pay coach fee: pick sessions + method (Stripe, Venmo, Zelle, Cash) -->
  <div class="overlay" id="pay-coach" hidden role="dialog" aria-modal="true" aria-labelledby="pc-title">
    <div class="modal p-modal pc-modal">
      <button class="x-btn" type="button" data-close aria-label="Close">✕</button>
      <h2 id="pc-title">Pay coach fee</h2>
      <p class="lead" id="pc-lead"></p>
      <fieldset class="pc-sessions"><legend>Sessions</legend><div id="pc-list"></div></fieldset>
      <fieldset class="pc-methods"><legend>Pay with</legend><div class="pc-grid" id="pc-methods"></div></fieldset>
      <p class="pc-hint" id="pc-hint"></p>
      <div class="pc-total"><span>Total</span><b id="pc-total">$0</b></div>
      <div class="p-acts"><button class="btn btn-lg btn-soft" type="button" data-close>Cancel</button><button class="btn btn-lg btn-primary" type="button" id="pc-go">Pay</button></div>
    </div>
  </div>

  <script src="js/player-header.js"></script>
  <script src="../organizer/js/organizer.js"></script>
  <script src="js/player-data.js"></script>
  <script src="js/chat-config.js"></script>
  <script>window.DirectChatConfig = PLAYER_CHAT;</script>
  <script src="../organizer/js/direct-chat.js"></script>
  <script src="js/clinic-page.js"></script>
</body>
</html>
