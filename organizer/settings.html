<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile and settings · ClinicSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="stylesheet" href="css/organizer.css">
  <link rel="stylesheet" href="css/pages/settings.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">
</head>
<body data-role="organizer">
  <header class="o-header">
    <a class="o-brand" href="dashboard.html"><img src="assets/logo-mark.png" alt=""><span>ClinicSync</span></a>
    <nav class="o-nav" aria-label="Main">
      <a href="dashboard.html"><span class="o-nav-ico" style="--ico:url(../assets/icons/nav-clinics.svg)" aria-hidden="true"></span><span class="o-nav-label">Dashboard</span></a>
      <a href="clinics.html"><span class="o-nav-ico" style="--ico:url(../assets/icons/court-basketball.svg)" aria-hidden="true"></span><span class="o-nav-label">Clinics</span></a>
      <a href="messages.html"><span class="o-nav-ico" style="--ico:url(../assets/icons/chat-circle.svg)" aria-hidden="true"></span><span class="o-nav-label">Messages</span><span class="o-nav-count" aria-label="3 unread">3</span></a>
    </nav>
    <div class="o-header-right">
      <button class="o-bell" type="button" aria-label="Notifications, unread" data-toast="Notifications aren't part of this prototype"><img src="assets/icons/bell.svg" alt=""><span class="dot"></span></button>
      <div class="o-account">
        <button type="button" data-menu="#account-menu" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar"><img src="assets/icons/user.svg" alt=""></span><span class="name">Albert John</span><img class="icon-24" src="assets/icons/caret-down.svg" alt="">
        </button>
        <div class="menu" id="account-menu" role="menu" hidden>
          <a role="menuitem" href="settings.html">My profile</a>
          <a role="menuitem" href="settings.html?tab=support">Support</a>
          <a role="menuitem" href="sign-in.html">Logout</a>
        </div>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="st-head"><h1 class="h1">Profile and settings</h1><p>Your profile, plan and account.</p></div>
    <nav class="tabs" id="st-tabs" aria-label="Settings"></nav>
    <div id="st-body"></div>
  </main>
  <script src="js/organizer.js"></script>
  <script src="js/settings-page.js"></script>
</body>
</html>
