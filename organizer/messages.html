<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · ClinicSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="stylesheet" href="css/organizer.css">
  <link rel="stylesheet" href="css/pages/clinics.css">
  <link rel="stylesheet" href="css/pages/direct-chat.css">
</head>
<body>
  <!-- Figma: Organizer / Messages / 01 Group chat (698:25546) and DM 01–03 -->
  <header class="o-header">
    <a class="o-brand" href="dashboard.html"><img src="assets/logo-mark.png" alt=""><span>ClinicSync</span></a>
    <nav class="o-nav" aria-label="Main">
      <a href="dashboard.html"><span class="o-nav-ico" style="--ico:url(../assets/icons/nav-clinics.svg)" aria-hidden="true"></span><span class="o-nav-label">Dashboard</span></a>
      <a href="clinics.html"><span class="o-nav-ico" style="--ico:url(../assets/icons/court-basketball.svg)" aria-hidden="true"></span><span class="o-nav-label">Clinics</span></a>
      <a href="messages.html" class="on" aria-current="page"><span class="o-nav-ico" style="--ico:url(../assets/icons/chat-circle.svg)" aria-hidden="true"></span><span class="o-nav-label">Messages</span><span class="o-nav-count" aria-label="3 unread">3</span></a>
    </nav>
    <div class="o-header-right">
      <button class="o-bell" type="button" aria-label="Notifications, unread" data-toast="Notifications aren't part of this prototype"><img src="assets/icons/bell.svg" alt=""><span class="dot"></span></button>
      <div class="o-account">
        <button type="button" data-menu="#account-menu" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar"><img src="assets/icons/user.svg" alt=""></span><span class="name">Albert John</span><img class="icon-24" src="assets/icons/caret-down.svg" alt="">
        </button>
        <div class="menu" id="account-menu" role="menu" hidden>
          <a role="menuitem" href="complete-profile.html">My profile</a>
          <button role="menuitem" type="button" id="reset-demo">Reset prototype data</button>
          <a role="menuitem" href="sign-in.html">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="list-head">
      <div>
        <h1 class="h1">Messages</h1>
        <p>Each clinic has one group chat with its players, substitutes and coach.</p>
      </div>
      <button class="btn btn-md btn-dark" type="button" data-open="#new-dm"><img class="icon" src="assets/icons/plus.svg" alt="">New message</button>
    </div>

    <div class="msg-split">
      <div class="msg-left">
        <div class="search"><img src="assets/icons/search.svg" alt=""><input class="input" id="chat-q" type="search" placeholder="Search clinic chats" aria-label="Search chats"></div>
        <div class="seg" role="tablist" aria-label="Show">
          <button class="on" type="button" role="tab" data-show="group">Clinics</button>
          <button type="button" role="tab" data-show="dm">Direct</button>
        </div>
        <div class="chat-list" id="chats"></div>
        <p class="muted" id="chats-empty" hidden>No chats match your search.</p>
      </div>
      <div class="msg-right" id="chat-panel"></div>
    </div>
  </main>

  <!-- New message: anyone in the clinics you organize -->
  <div class="overlay" id="new-dm" hidden role="dialog" aria-modal="true" aria-labelledby="nd-title">
    <div class="modal dm-new">
      <button class="x-btn" type="button" data-close aria-label="Close">✕</button>
      <h2 id="nd-title">New message</h2>
      <p>Message anyone in the clinics you organize.</p>
      <div class="search"><img src="assets/icons/search.svg" alt=""><input class="input" id="nd-q" type="search" placeholder="Search by name" aria-label="Search by name"></div>
      <div class="dm-filter" id="nd-filter" role="tablist" aria-label="Role">
        <button class="on" type="button" data-role="">All</button><button type="button" data-role="Player">Players</button><button type="button" data-role="Substitute">Substitutes</button><button type="button" data-role="Coach">Coaches</button>
      </div>
      <div class="dm-people" id="nd-list"></div>
    </div>
  </div>

  <script src="js/organizer.js"></script>
  <script>
    const SAT = { name: 'Saturday Tennis', when: 'Saturdays · 9:00–10:30 AM' }, THU = { name: 'Thursday Rally', when: 'Thursdays · 6:00–7:30 PM' }, WKD = { name: 'Weekend Beginners', when: 'Sundays · 10:00–11:30 AM' };
    const P = 'assets/img/people/';
    window.DirectChatConfig = {
      inline: '#chat-panel', me: 'Albert', clinic: 'Saturday Tennis', membersWord: 'Players',
      // Clinic chats as in the Figma Messages screens; direct threads as in DM 01
      seed: {
        'Saturday Tennis': [
          { from: 'me', t: 'Please arrive 10 minutes early for Saturday’s session.', at: 'Yesterday, 6:10 PM' },
          { from: 'them', who: 'Jessica Lee', role: 'Player', ini: 'JL', photo: P + 'blonde.png', t: 'I’m running about 15 minutes late today.', at: 'Today, 8:20 AM' },
          { from: 'them', who: 'Robert Wilson', role: 'Player', ini: 'RW', photo: P + 'man1.png', t: 'Thanks for letting us know!', at: 'Today, 8:22 AM' },
          { from: 'me', t: 'We may need more substitutes for upcoming sessions.', at: 'Today, 8:30 AM' },
          { from: 'them', who: 'Robert Wilson', role: 'Player', ini: 'RW', photo: P + 'man1.png', t: 'I can cover Session 4 if Jessica can’t make it.', at: 'Today, 9:22 AM' },
        ],
        'Thursday Rally': [{ from: 'them', who: 'Jenny', role: 'Organizer', ini: 'JW', photo: P + 'red.png', t: 'Courts 3 and 4 tonight. Please confirm by 5 PM.', at: 'Today, 8:05 AM' }],
        'Monday Morning Tennis': [{ from: 'me', t: 'Session 5 moves to Mon, Oct 26 at 6:00 PM. Approved by Sophia.', at: 'Yesterday, 5:30 PM' }],
        'Tuesday Tennis Club': [{ from: 'them', who: 'Grace Liu', role: 'Player', ini: 'GL', t: 'Thanks for the reminder, see everyone at 6!', at: 'Oct 7, 4:12 PM' }],
        'Weekend Beginners': [{ from: 'me', t: 'Bring water, we’ll do serve drills first.', at: 'Oct 5, 9:00 AM' }],
        'Maria Lopez': [
          { from: 'them', t: 'Hi Albert, should I bring the ball machine on Saturday?', at: 'Today, 9:40 AM' },
          { from: 'me', t: 'Yes please, courts 2 and 3 are ours.', at: 'Today, 9:45 AM' },
          { from: 'them', t: 'Great, see you then!', at: 'Today, 9:46 AM' },
        ],
        'Olivia Chen': [{ from: 'them', t: 'Is it okay if I leave 10 minutes early this week?', at: 'Today, 8:05 AM' }],
        'Jessica Lee': [{ from: 'them', t: 'Sorry, I can’t make it on Oct 24.', at: 'Mon, 7:50 PM' }, { from: 'me', t: 'No problem, I’ll find you a replacement.', at: 'Mon, 8:02 PM' }],
      },
      profiles: {
        'Maria Lopez': { level: 'Tennis · Certified coach', fee: '$25 per player, per session', since: 'March 2025', clinics: [{ ...SAT, their: 'Coach' }, { ...WKD, their: 'Coach' }] },
        'Jessica Lee': { level: 'Tennis · NTRP 3.5', since: 'September 2025', clinics: [{ ...SAT, their: 'Player' }] },
        'Robert Wilson': { level: 'Tennis · NTRP 4.0', since: 'May 2025', clinics: [{ ...SAT, their: 'Player' }, { ...THU, their: 'Substitute' }] },
        'Priya Nair': { level: 'Tennis · NTRP 3.5', since: 'July 2025', clinics: [{ ...SAT, their: 'Substitute' }] },
        'Olivia Chen': { level: 'Tennis · NTRP 3.5', since: 'January 2026', clinics: [{ ...THU, their: 'Player' }] },
        'Daniel Kim': { level: 'Tennis · NTRP 3.5', since: 'April 2025', clinics: [{ ...THU, their: 'Player' }] },
      },
    };
  </script>
  <script src="js/direct-chat.js"></script>
  <script src="js/messages-page.js"></script>
  <script>
    MessagesPage({
      caret: 'assets/icons/caret-right.svg',
      unread: { 'Saturday Tennis': 2, 'Thursday Rally': 1, 'Olivia Chen': 1 },
      groups: [
        { name: 'Saturday Tennis', ini: 'ST', tone: '', role: 'Organizer', members: 9 },
        { name: 'Thursday Rally', ini: 'TR', tone: 'ok', role: 'Player', members: 8 },
        { name: 'Monday Morning Tennis', ini: 'MM', tone: 'warn', role: 'Organizer', members: 9 },
        { name: 'Tuesday Tennis Club', ini: 'TT', tone: '', role: 'Organizer', members: 10 },
        { name: 'Weekend Beginners', ini: 'WB', tone: 'purple', role: 'Coach', members: 6 },
        { name: 'Friday Padel Night', ini: 'FP', tone: '', role: 'Organizer', members: 4, empty: 'No messages yet. The chat opens when the first session is scheduled.' },
      ],
      people: [
        { clinic: 'Saturday Tennis', name: 'Maria Lopez', role: 'Coach', photo: P + 'coach.png' },
        { clinic: 'Saturday Tennis', name: 'Jessica Lee', role: 'Player', photo: P + 'blonde.png' },
        { clinic: 'Saturday Tennis', name: 'Robert Wilson', role: 'Player', photo: P + 'man1.png' },
        { clinic: 'Saturday Tennis', name: 'Priya Nair', role: 'Substitute', photo: P + 'dark.png' },
        { clinic: 'Thursday Rally', name: 'Olivia Chen', role: 'Player', photo: P + 'sophia.png' },
        { clinic: 'Thursday Rally', name: 'Daniel Kim', role: 'Player', photo: P + 'man2.png' },
      ],
    });
  </script>
</body>
</html>
