<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your clinic schedule · ClinicSync</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="stylesheet" href="css/organizer.css">
  <link rel="stylesheet" href="css/pages/create-clinic.css">
</head>
<body>
  <header class="o-header">
    <a class="o-brand" href="dashboard.html"><img src="assets/logo-mark.png" alt=""><span>ClinicSync</span></a>
    <div class="o-header-right">
      <div class="o-account">
        <button type="button" data-menu="#account-menu" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar"><img src="assets/icons/user.svg" alt=""></span><span class="name">Albert John</span><img class="icon-24" src="assets/icons/caret-down.svg" alt="">
        </button>
        <div class="menu" id="account-menu" role="menu" hidden>
          <a role="menuitem" href="complete-profile.html">My profile</a>
          <a role="menuitem" href="sign-in.html">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <main class="wz-main">
    <div class="wz-head">
      <h1>Set Your Clinic Schedule</h1>
      <p>Choose when your clinic meets and how much the series costs.</p>
    </div>
    <form class="wz-form" id="step-form" novalidate>
      <div class="wz-row">
        <div class="wz-field">
          <label for="start-text">Start date</label>
          <div class="wz-input" id="start-box">
            <input id="start-text" name="start" value="17 Oct 2026" readonly aria-haspopup="dialog" style="flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer">
            <button type="button" id="start-btn" aria-label="Pick date" style="border:0;background:none;padding:0;display:grid;cursor:pointer"><img src="assets/icons/calendar-24.svg" alt="" width="24" height="24"></button>
          </div>
          <input type="date" class="wz-date-native" id="start-native" value="2026-10-17" tabindex="-1" aria-hidden="true">
        </div>
        <div class="wz-field" data-listbox id="day-field">
          <label id="day-label">Recurring Day</label>
          <input type="hidden" name="day">
          <button class="wz-input" type="button" data-menu="#day-menu" aria-haspopup="listbox" aria-labelledby="day-label"><span class="val ph">Select day</span><img src="assets/icons/caret-down.svg" alt=""></button>
          <div class="menu" id="day-menu" role="listbox" hidden>
            <button type="button" data-value="Monday">Monday</button>
            <button type="button" data-value="Tuesday">Tuesday</button>
            <button type="button" data-value="Wednesday">Wednesday</button>
            <button type="button" data-value="Thursday">Thursday</button>
            <button type="button" data-value="Friday">Friday</button>
            <button type="button" data-value="Saturday">Saturday</button>
            <button type="button" data-value="Sunday">Sunday</button>
          </div>
        </div>
      </div>
      <div class="wz-row">
        <div class="wz-field" data-listbox>
          <label id="time-label">Session starts</label>
          <input type="hidden" name="time" value="6:00 PM">
          <button class="wz-input" type="button" data-menu="#time-menu" aria-haspopup="listbox" aria-labelledby="time-label"><span class="val">6:00 PM</span><img src="assets/icons/clock.svg" alt=""></button>
          <div class="menu" id="time-menu" role="listbox" hidden>
            <button type="button" data-value="6:00 AM">6:00 AM</button>
            <button type="button" data-value="7:00 AM">7:00 AM</button>
            <button type="button" data-value="8:00 AM">8:00 AM</button>
            <button type="button" data-value="9:00 AM">9:00 AM</button>
            <button type="button" data-value="10:00 AM">10:00 AM</button>
            <button type="button" data-value="11:00 AM">11:00 AM</button>
            <button type="button" data-value="12:00 PM">12:00 PM</button>
            <button type="button" data-value="1:00 PM">1:00 PM</button>
            <button type="button" data-value="2:00 PM">2:00 PM</button>
            <button type="button" data-value="3:00 PM">3:00 PM</button>
            <button type="button" data-value="4:00 PM">4:00 PM</button>
            <button type="button" data-value="5:00 PM">5:00 PM</button>
            <button type="button" data-value="6:00 PM">6:00 PM</button>
            <button type="button" data-value="7:00 PM">7:00 PM</button>
            <button type="button" data-value="8:00 PM">8:00 PM</button>
            <button type="button" data-value="9:00 PM">9:00 PM</button>
          </div>
        </div>
        <div class="wz-field" id="length-field">
          <label for="length">Length</label>
          <input class="wz-input" id="length" name="length" placeholder="e.g, 90 minutes" autocomplete="off">
        </div>
      </div>
      <div class="wz-field" id="sessions-field">
        <label for="sessions">Number of sessions</label>
        <input class="wz-input" id="sessions" name="sessions" value="8" inputmode="numeric" autocomplete="off">
      </div>
      <section class="wz-section">
        <h2 class="wz-h2">Clinic Fees</h2>
        <div class="wz-field">
          <label for="fee">Total Clinic Fee <span class="muted">(Optional)</span></label>
          <div class="wz-input wz-prefixed"><span class="pre">$</span><input id="fee" name="fee" placeholder="1,000.00" inputmode="decimal" autocomplete="off"></div>
        </div>
      </section>
    </form>
    <label class="wz-check"><input type="checkbox" id="holiday" form="step-form"><span>Your schedule includes Thanksgiving (Nov 26). Exclude this holiday to adjust your total sessions automatically.</span></label>
  </main>

  <footer class="stepbar">
    <a class="btn btn-soft wz-back" href="create-clinic-1.html">Back</a>
    <div class="progress"><div class="bars" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div><small>Create Clinic • Step 2 of 5</small></div>
    <div class="right"><button class="btn btn-primary wz-next" type="submit" form="step-form">Continue</button></div>
  </footer>
  <script src="js/organizer.js"></script>
  <script src="js/create-clinic.js"></script>
  <script>
    const form = document.getElementById('step-form');
    const startText = document.getElementById('start-text'), startNative = document.getElementById('start-native');
    const fmt = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1]} ${y}`; };
    const pick = () => { try { startNative.showPicker(); } catch (e) { startNative.focus(); } };
    startText.addEventListener('click', pick);
    document.getElementById('start-btn').addEventListener('click', pick);
    startNative.addEventListener('change', () => { if (startNative.value) startText.value = fmt(startNative.value); });

    const holiday = document.getElementById('holiday'), sessions = document.getElementById('sessions');
    let base = 8;
    sessions.addEventListener('input', () => { base = parseInt(sessions.value, 10) || 0; });
    holiday.addEventListener('change', () => { // excluding the holiday removes one session
      const n = parseInt(sessions.value, 10) || 0;
      sessions.value = holiday.checked ? Math.max(n - 1, 0) : n + 1;
    });

    const s = wz.get();
    if (s.start) startText.value = s.start;
    if (s.day) { form.day.value = s.day; document.querySelector('#day-field .val').textContent = s.day; document.querySelector('#day-field .val').classList.remove('ph'); }
    if (s.length) document.getElementById('length').value = s.length;
    if (s.sessions) sessions.value = s.sessions;
    if (s.fee) form.fee.value = s.fee;
    if (s.time) { form.time.value = s.time; form.time.closest('[data-listbox]').querySelector('.val').textContent = s.time; }

    form.addEventListener('submit', e => {
      e.preventDefault();
      let ok = true;
      if (!form.day.value) { wzError(document.getElementById('day-field'), 'Select a recurring day'); ok = false; }
      if (!document.getElementById('length').value.trim()) { wzError(document.getElementById('length-field'), 'Enter the session length'); ok = false; }
      if (!(parseInt(sessions.value, 10) > 0)) { wzError(document.getElementById('sessions-field'), 'Enter the number of sessions'); ok = false; }
      if (!ok) return;
      wz.set({ start: startText.value, day: form.day.value, time: form.time.value, length: document.getElementById('length').value.trim(), sessions: sessions.value, fee: form.fee.value.trim() });
      location.href = 'create-clinic-3.html';
    });
  </script>
</body>
</html>
