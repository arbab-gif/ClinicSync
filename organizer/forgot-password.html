<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · ClinicSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="stylesheet" href="css/organizer.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth">
  <div class="auth-shell">
    <aside class="auth-photo" style="background-image:url(assets/img/auth-sign-in.jpg)">
      <span class="ring"></span>
      <div class="cap">
        <div class="dashes" aria-hidden="true"><i class="on"></i><i class="half"></i><i></i><i></i></div>
        <h2>Manage players. Keep your clinic <em>organized</em>.</h2>
      </div>
    </aside>
    <main class="auth-main">
      <div class="auth-form">
        <div class="auth-head">
          <h1>Forgot password?</h1>
          <p>Enter the email linked to your account and we'll send you a 6-digit code.</p>
        </div>
        <form id="f" novalidate>
          <div class="a-field">
            <label for="email">Email<span class="req">*</span></label>
            <div class="a-box" id="eb"><input id="email" type="email" placeholder="Enter your email" autocomplete="email"></div>
            <div class="a-err" id="err" role="alert" hidden>We couldn't find an account with this email.</div>
          </div>
          <div class="auth-actions">
            <button class="auth-btn" id="go" type="submit" disabled>Send code</button>
            <a class="back-link" href="sign-in.html"><img src="assets/icons/arrow-left.svg" alt="">Back to sign in</a>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="js/organizer.js"></script>
  <script>
    const em = document.getElementById('email'), go = document.getElementById('go'), eb = document.getElementById('eb'), err = document.getElementById('err');
    // Prototype rule: the button enables once the text looks like an email (contains "@").
    // An email is "not found" (Wrong Email state) unless it ends in "@test.com"; anything without "@" can't be submitted.
    const valid = v => /^[^\s@]+@[^\s@]+$/.test(v.trim());
    const found = v => v.trim().toLowerCase().endsWith('@test.com');
    em.addEventListener('input', () => { go.disabled = !valid(em.value); eb.classList.remove('err'); err.hidden = true; });
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      if (go.disabled) return;
      if (!found(em.value)) { eb.classList.add('err'); err.hidden = false; return; }
      sessionStorage.setItem('cs_email', em.value.trim());
      location.href = 'verify-code.html';
    });
  </script>
</body>
</html>
