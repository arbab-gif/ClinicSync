<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create new password · ClinicSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="stylesheet" href="css/organizer.css">
  <link rel="stylesheet" href="css/pages/auth.css">
  <link rel="stylesheet" href="css/pages/create-password.css">
</head>
<body class="auth">
  <div class="auth-shell">
    <aside class="auth-photo" style="background-image:url(assets/img/auth-sign-in.jpg)">
      <span class="ring"></span>
      <div class="cap">
        <div class="dashes" aria-hidden="true"><i class="on"></i><i class="half"></i><i></i><i></i></div>
        <h2>Manage players. Keep your clinic <em>organized</em>.</h2>
      </div>
    </aside>
    <main class="auth-main">
      <div class="auth-form">
        <div class="auth-head">
          <h1>Create new password</h1>
          <p>Your new password must be different from previous passwords.</p>
        </div>
        <form id="f" novalidate>
          <div class="auth-fields">
            <div class="a-field">
              <label for="pw">New password<span class="req">*</span></label>
              <div class="a-box"><input id="pw" type="password" placeholder="Enter new password" autocomplete="new-password">
                <button type="button" data-eye="pw" aria-label="Show password"><img class="icon-24" src="assets/icons/eye.svg" alt=""></button></div>
              <ul class="reqs" id="reqs">
                <li data-r="len">At least 8 characters</li>
                <li data-r="up">One uppercase letter</li>
                <li data-r="num">One number</li>
                <li data-r="sp">One special character</li>
              </ul>
            </div>
            <div class="a-field">
              <label for="pw2">Confirm password<span class="req">*</span></label>
              <div class="a-box" id="b2"><input id="pw2" type="password" placeholder="Re-enter new password" autocomplete="new-password">
                <button type="button" data-eye="pw2" aria-label="Show password"><img class="icon-24" src="assets/icons/eye.svg" alt=""></button></div>
              <div class="a-err" id="err" role="alert" hidden>Passwords don't match.</div>
            </div>
          </div>
          <button class="auth-btn" id="go" type="submit">Reset password</button>
        </form>
      </div>
    </main>
  </div>
  <script src="js/organizer.js"></script>
  <script>
    const pw = document.getElementById('pw'), pw2 = document.getElementById('pw2'), b2 = document.getElementById('b2'), err = document.getElementById('err');
    const rules = { len: v => v.length >= 8, up: v => /[A-Z]/.test(v), num: v => /\d/.test(v), sp: v => /[^A-Za-z0-9]/.test(v) };
    const check = () => { document.querySelectorAll('#reqs li').forEach(li => li.classList.toggle('met', rules[li.dataset.r](pw.value))); };
    pw.addEventListener('input', check);
    pw2.addEventListener('input', () => { b2.classList.remove('err'); err.hidden = true; });
    document.querySelectorAll('[data-eye]').forEach(b => b.onclick = () => { const i = document.getElementById(b.dataset.eye); i.type = i.type === 'password' ? 'text' : 'password'; });
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      const allMet = Object.values(rules).every(r => r(pw.value));
      if (!allMet) { pw.focus(); window.toast('Password does not meet all requirements'); return; }
      if (pw.value !== pw2.value) { b2.classList.add('err'); err.hidden = false; return; }
      location.href = 'password-updated.html';
    });
  </script>
</body>
</html>
